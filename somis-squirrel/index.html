 <g id="hEar"><path d="M84 -8 h16 l6 6 h0 l0 4 l-6 6 h-16z" fill="url(#brass)"/>

 <g id="hHorn"><path d="M-86 -8 q-30 0 -34 26 l-6 18 h36 l-4 -18 q2 -10 10 -12z" fill="url(#brass)" stroke="#6b4c18" stroke-width="2"/>

<div id="start" class="ov"><span>▶ Tap to start</span></div>
<div id="choice" class="ov"><button id="allow">🎤 Allow mic</button><button id="deny">Disallow</button></div>
<div id="site" class="ov"><h1>Somis Nut House</h1><p>(Normal click-through website goes here: browse nuts, add to cart.)</p></div>
<script>
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
for(let i=0;i<10;i++){const a=i*36*Math.PI/180+0.6,c=document.createElementNS(NS,'circle');c.setAttribute('cx',30*Math.cos(a));c.setAttribute('cy',-58+30*Math.sin(a));c.setAttribute('r',7);c.setAttribute('fill','#fff');c.setAttribute('stroke','#111');$('dial').appendChild(c);}
const Q=new URLSearchParams(location.search),EMBED=Q.has('embed'),RENDER=Q.has('render');
if(EMBED){document.documentElement.style.background=document.body.style.background='transparent';$('bg').style.display='none';$('choice').remove();$('site').remove();$('start').querySelector('span').textContent='▶';$('start').style.background='transparent';}
function post(m){if(parent!==window)parent.postMessage({type:m},'*');}
const ring=new Audio('ring.mp3'),voice=new Audio('voice.mp3');
const T={ring:0.15,ringEnd:1.7,runStart:1.3,runEnd:2.3,pick:2.35,picked:2.85,voice:2.95,end:10.0};T.prompt=T.voice+6.6;
let cues=[];
const cl=k=>Math.max(0,Math.min(1,k)),lerp=(a,b,k)=>a+(b-a)*cl(k),ease=k=>{k=cl(k);return k*k*(3-2*k)};
function viseme(t){const v=t-T.voice;for(const c of cues)if(v>=c.start&&v<c.end)return c.value;return 'X';}
const SX=700,SY=520;
function draw(t){
 const sx=lerp(1420,SX,ease((t-T.runStart)/(T.runEnd-T.runStart)));
 const running=t>T.runStart&&t<T.runEnd+0.1,ph=t*20;
 const bob=running?-Math.abs(Math.sin(ph))*16:0, lean=running?-8:0;
 $('sq').setAttribute('transform',`translate(${sx},${SY+bob-36}) rotate(${lean})`);
 const sw=running?Math.sin(ph)*40:0;
 $('legF').setAttribute('transform',`translate(-18,-12) rotate(${sw})`);$('legB').setAttribute('transform',`translate(18,-12) rotate(${-sw})`);
 $('tail').setAttribute('transform',`rotate(${running?Math.sin(ph*0.5)*6-10:Math.sin(t*2.5)*5},30,-40)`);
 $('armL').setAttribute('d',running?`M-40 -100 Q${-60+sw*0.4} -75 ${-45+sw*0.6} -55`:`M-40 -100 Q-55 -70 -30 -60`);
 // handset: cradle -> held vertical at squirrel's right ear (world right of head)
 let hx=470,hy=309,rot=0;
 if(t>T.ring&&t<T.pick){const r=(t-T.ring)%1.2;if(r<0.8&&t<T.ringEnd+0.3){hy-=Math.abs(Math.sin(t*60))*8;rot=Math.sin(t*70)*5;}}
 const k=ease((t-T.pick)/(T.picked-T.pick));
 const ex=sx+70,ey=SY-36-150; // held center: earpiece at ear (top), mouthpiece by cheek, right of mouth
 let sc=1,fy=1,dd=0;if(t>=T.pick){const A=-65,R=A*Math.PI/180,S=0.8,c=Math.cos(R),n=Math.sin(R),D=77;
  // held: cup at ear, handle shortened by D each side, flipped so horn opens toward the face
  const ex2=sx+66,ey2=SY-202;const tx=ex2-(120-D)*S*c,ty=ey2-(120-D)*S*n;
  hx=lerp(470,tx,k);hy=lerp(309,ty,k);rot=lerp(0,A,k);sc=lerp(1,S,k);fy=lerp(1,-1,k);dd=D*k;}
 $('handset').setAttribute('transform',`translate(${hx},${hy}) rotate(${rot}) scale(${sc},${sc*(Math.abs(fy)<0.15?Math.sign(fy||1)*0.15:fy)})`);
 $('hEar').setAttribute('transform',`translate(${-dd},0)`);$('hHorn').setAttribute('transform',`translate(${dd},0)`);
 $('hHandle').setAttribute('transform',`scale(${Math.max(0.05,(90-dd)/90)},1)`);$('hRibs').style.display=dd>20?'none':'';
 const r=rot*Math.PI/180;
 {const lpx=-118+dd,lpy=20*fy,x0=hx+sc*(lpx*Math.cos(r)-lpy*Math.sin(r)),y0=hy+sc*(lpx*Math.sin(r)+lpy*Math.cos(r)),x1=360,y1=496;
  const c1x=x0-50,c1y=y0+120,c2x=x1-70,c2y=y1+20;let d='',N=90;
  for(let i=0;i<=N;i++){const u=i/N,m=1-u,bx=m*m*m*x0+3*m*m*u*c1x+3*m*u*u*c2x+u*u*u*x1,by=m*m*m*y0+3*m*m*u*c1y+3*m*u*u*c2y+u*u*u*y1;
   const tx=3*m*m*(c1x-x0)+6*m*u*(c2x-c1x)+3*u*u*(x1-c2x),ty=3*m*m*(c1y-y0)+6*m*u*(c2y-c1y)+3*u*u*(y1-c2y),L=Math.hypot(tx,ty)||1;
   const o=(i>3&&i<N-3)?Math.sin(i*1.6)*6:0;d+=(i?'L':'M')+(bx-ty/L*o).toFixed(1)+' '+(by+tx/L*o).toFixed(1);}
  $('cord').setAttribute('d',d);}
 // right arm: shoulder in world coords; paw rests, reaches, then grips handset middle
 const shx=sx+40,shy=SY+bob-36-100;
 let px,py;
 if(t<T.runEnd+0.05){px=shx+(running?-sw*0.6:-5);py=shy+45;}
 else if(t<T.pick){const kk=ease((t-T.runEnd)/(T.pick-T.runEnd));px=lerp(shx-5,hx+20,kk);py=lerp(shy+45,hy,kk);}
 else{px=hx+10*Math.sin(r)+20*Math.cos(r)*0;py=hy;px=hx;}
 $('armR').setAttribute('d',`M${shx} ${shy} Q${Math.max(shx,px)+28} ${(shy+py)/2+20} ${px} ${py}`);
 $('paw').setAttribute('transform',`translate(${px},${py}) rotate(${rot})`);
 $('head').setAttribute('transform',`translate(0,-170) rotate(${t>T.voice?6+Math.sin(t*3)*2:(t>T.pick?6*ease((t-T.pick)/0.5):(running?-4:0))})`);
 const bl=(t%3.7)<0.12?1:0;$('lids').setAttribute('height',bl?36:0);
 const v=viseme(t);for(const g of document.querySelectorAll('#mouth g'))g.style.display=g.dataset.v===v?'':'none';
}
window.seek=draw;
fetch('mouth.json').then(r=>r.json()).then(j=>{cues=j.mouthCues;draw(0);window.ready=true;});
let t0=null,st={},running=false;
function loop(now){if(t0===null)t0=now;let t=(now-t0)/1000;
 if(!st.r&&t>=T.ring){st.r=1;ring.play().catch(()=>{});}
 if(!st.v&&t>=T.voice){st.v=1;voice.play().catch(()=>{});}
 if(st.v&&!voice.paused&&!voice.ended)t=T.voice+voice.currentTime;
 draw(Math.min(t,T.prompt));
 if(t>=T.prompt&&!st.c){st.c=1;if(EMBED)post('squirrel-done');else $('choice').style.display='flex';}
 if(!st.c)requestAnimationFrame(loop);}
function go(){if(running)return;running=true;const s=$('start');if(s)s.remove();post('squirrel-started');requestAnimationFrame(loop);}
if($('allow'))$('allow').onclick=async()=>{$('choice').style.display='none';try{await navigator.mediaDevices.getUserMedia({audio:true});$('connected').style.display='';}catch(e){$('site').style.display='flex';}};
if($('deny'))$('deny').onclick=()=>{$('choice').style.display='none';$('site').style.display='flex';};
$('start').onclick=go;
addEventListener('message',e=>{const d=e.data;if(d==='squirrel-start'||(d&&d.type==='squirrel-start'))go();});
if(RENDER)$('start').remove();
else if(EMBED&&Q.has('autostart')){ring.play().then(()=>{ring.pause();ring.currentTime=0;go();}).catch(()=>{});} // autoplay only if browser allows sound
window.addEventListener('load',()=>post('squirrel-ready'));
</script></body></html>
