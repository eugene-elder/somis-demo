<!DOCTYPE html><html><head><meta charset="utf-8"><title>Somis Nut House</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#1a0f08;overflow:hidden;font-family:Georgia,serif}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#box{container-type:size;position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden}
#box video,#box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#inner img{object-fit:fill}
#box #still{overflow:hidden}
#still{position:absolute;inset:0;opacity:0;transition:opacity .15s;transform-origin:50% 75%}
#still img.eye{position:absolute;left:34.375%;top:25%;width:34.375%;height:27.78%;inset:auto}
#still img{visibility:hidden}#still img.on{visibility:visible}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#start{background:rgba(30,15,5,.45);color:#fff;font-size:28px;cursor:pointer;z-index:5}#start span{background:#8a4b1f;padding:18px 34px;border-radius:40px}
#choice{display:none;gap:20px;align-items:flex-end;padding-bottom:40px;z-index:4}#choice button{font:22px Georgia;padding:14px 30px;border-radius:30px;border:0;cursor:pointer}
#allow{background:#3d7a3a;color:#fff}#deny{background:#eee;color:#5a3a1a}
#site{display:none;background:#fbf4e6;color:#4a2a15;flex-direction:column;font-size:22px;z-index:6}
#status{position:fixed;top:16px;right:20px;color:#fff;background:#3d7a3a;padding:8px 16px;border-radius:20px;font:16px sans-serif;display:none;z-index:6}
</style></head><body>
<div id="stage"><div id="box">
 <video id="clip" src="clip.mp4" muted playsinline preload="auto"></video>
 <div id="still"><div id="inner" style="position:absolute;left:50%;top:50%;width:max(100%,177.78cqh);aspect-ratio:16/9;transform:translate(-50%,-50%)"></div></div>
</div></div>
<div id="start" class="ov"><span>▶ Tap to start</span></div>
<div id="choice" class="ov"><button id="allow">🎤 Allow mic</button><button id="deny">Disallow</button></div>
<div id="site" class="ov"><h1>Somis Nut House</h1><p>(Normal click-through website goes here: browse nuts, add to cart.)</p></div>
<div id="status">On the call…</div>
<script>
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search),EMBED=Q.has('embed');
if(EMBED){document.documentElement.style.background=document.body.style.background='transparent';$('choice').remove();$('site').remove();$('status').remove();$('start').querySelector('span').textContent='▶';$('start').style.background='transparent';
 const b=$('box');b.style.width='100%';b.style.height='100%';b.style.aspectRatio='auto';}
function post(m){if(parent!==window)parent.postMessage({type:m},'*');}
const SHAPES=['X','A','B','C','D','E','F','G','H'],imgs={};
for(const k of SHAPES){const i=new Image();i.src='mouths/'+k+'.jpg';i.alt='';$('inner').appendChild(i);imgs[k]=i;}
const ring=new Audio('ring.mp3'),voice=new Audio('voice.mp3'),clip=$('clip');
const VOICE_DELAY=0.3,TAIL=0.5;let cues=[],cur='';
function setMouth(v){if(v===cur)return;if(imgs[cur])imgs[cur].classList.remove('on');imgs[v].classList.add('on');cur=v;}
setMouth('X');
const eyes={};for(const k of ['half','closed']){const i=new Image();i.src='eyes/'+k+'.png';i.className='eye';i.alt='';$('inner').appendChild(i);eyes[k]=i;}
function eye(k){for(const e in eyes)eyes[e].classList.toggle('on',e===k);}
function blink(){eye('half');setTimeout(()=>eye('closed'),40);setTimeout(()=>eye('half'),80);setTimeout(()=>eye(null),120);}
function blinkLoop(){if(done)return;blink();setTimeout(blinkLoop,2000+Math.random()*3000);}
function viseme(t){for(const c of cues)if(t>=c.start&&t<c.end)return c.value;return 'X';}
fetch('mouth.json').then(r=>r.json()).then(j=>{cues=j.mouthCues;window.ready=true;});
let running=false,done=false,cut=false;const CUT=4.85;
function talkLoop(){const t=voice.currentTime;setMouth(voice.ended?'X':viseme(t));
 const s=performance.now()/1000;$('still').style.transform=`rotate(${Math.sin(s*1.3)*0.35}deg) scale(${1.004+Math.sin(s*0.9)*0.004})`;
 if(!done)requestAnimationFrame(talkLoop);}
function finish(){if(done)return;setTimeout(()=>{done=true;setMouth('X');
const eyes={};for(const k of ['half','closed']){const i=new Image();i.src='eyes/'+k+'.png';i.className='eye';i.alt='';$('inner').appendChild(i);eyes[k]=i;}
function eye(k){for(const e in eyes)eyes[e].classList.toggle('on',e===k);}
function blink(){eye('half');setTimeout(()=>eye('closed'),40);setTimeout(()=>eye('half'),80);setTimeout(()=>eye(null),120);}
function blinkLoop(){if(done)return;blink();setTimeout(blinkLoop,2000+Math.random()*3000);}if(EMBED)post('squirrel-done');else $('choice').style.display='flex';},TAIL*1000);}
function toStill(){$('still').style.opacity=1;setTimeout(blink,350);setTimeout(blinkLoop,2600+Math.random()*1500);requestAnimationFrame(talkLoop);setTimeout(()=>{voice.play().catch(()=>{});},VOICE_DELAY*1000);}
voice.addEventListener('ended',finish);
clip.addEventListener('timeupdate',()=>{if(clip.currentTime>=CUT&&!cut){cut=true;toStill();}});clip.addEventListener('ended',()=>{if(!cut){cut=true;toStill();}});
function go(){if(running)return;running=true;const s=$('start');if(s)s.remove();post('squirrel-started');ring.play().catch(()=>{});clip.play().catch(()=>{});}
$('start').onclick=go;
addEventListener('message',e=>{const d=e.data;if(d==='squirrel-start'||(d&&d.type==='squirrel-start'))go();});
if($('allow'))$('allow').onclick=async()=>{$('choice').style.display='none';try{await navigator.mediaDevices.getUserMedia({audio:true});$('status').style.display='';}catch(e){$('site').style.display='flex';}};
if($('deny'))$('deny').onclick=()=>{$('choice').style.display='none';$('site').style.display='flex';};
if(EMBED&&Q.has('autostart')){ring.play().then(()=>{ring.pause();ring.currentTime=0;go();}).catch(()=>{});}
window.addEventListener('load',()=>post('squirrel-ready'));
</script></body></html>
